workflows:
  android-workflow:
    name: Android Build Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        # Node.js version
        NODE_VERSION: "18.20.0"
        # React Native CLI
        REACT_NATIVE_VERSION: "0.74.1"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
    scripts:
      - name: Install Node.js
        script: |
          echo "Installing Node.js $NODE_VERSION"
          brew install node@$NODE_VERSION
          brew link --overwrite node@$NODE_VERSION
      - name: Install dependencies
        script: |
          echo "Installing npm dependencies with legacy peer deps"
          npm install --legacy-peer-deps
      - name: Build Android APK
        script: |
          echo "Building Android APK"
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "gradlew not found, using gradle wrapper installation"
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleRelease
          fi
      - name: Build Android AAB (Play Store)
        script: |
          echo "Building Android AAB for Play Store"
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - mechseiko@gmail.com
