// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "34.0.0"
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "25.1.8937393"
    kotlinVersion = "1.9.0"
  }
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
    maven { url "https://jitpack.io" }

    // React Native Maven repository
    maven {
        url("$rootDir/../node_modules/react-native/android")
    }
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.2.1')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0')
  }
}

apply plugin: "com.facebook.react.rootproject"

// Keep Gradle build outputs outside OneDrive. Files On-Demand keeps open handles on
// freshly written intermediate files, which makes tasks like mergeReleaseResources
// intermittently fail with "Unable to delete directory ...". Relocating every
// module's buildDir to a local (non-synced) path avoids that entirely.
def relocatedBuildRoot = new File(System.getenv("SUHOOR_BUILD_DIR") ?: "C:/AndroidBuilds/suhoor-native")
allprojects { proj ->
    proj.buildDir = new File(relocatedBuildRoot, proj.path.replaceAll(":", "_"))
}

allprojects {
  configurations.all {
    exclude group: 'com.android.support'
  }
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
    maven { url "https://jitpack.io" }

    // Ensure Gradle looks inside node_modules for native dependencies
    maven {
        url("$rootDir/../node_modules/react-native/android")
    }
    maven {
        url("$rootDir/../node_modules/jsc-android/dist")
    }
  }
}
