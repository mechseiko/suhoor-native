// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    // NDK r27+ compiles 16 KB-aligned native libraries by default.
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.0"
  }
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
    maven { url "https://jitpack.io" }

    // React Native Maven repository
    maven {
        url("$rootDir/../node_modules/react-native/android")
    }
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.8.2')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0')
    classpath('com.google.gms:google-services:4.4.1')
  }
}

apply plugin: "com.facebook.react.rootproject"

// Build outputs are now in the standard project location after OneDrive sync was fixed

allprojects {
  configurations.all {
    exclude group: 'com.android.support'
  }
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
    maven { url "https://jitpack.io" }

    // Ensure Gradle looks inside node_modules for native dependencies
    maven {
        url("$rootDir/../node_modules/react-native/android")
    }
    maven {
        url("$rootDir/../node_modules/jsc-android/dist")
    }
  }
}

